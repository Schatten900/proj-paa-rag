version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bot-backend
    ports:
      - "5000:5000"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_LLM_MODEL: qwen2.5:3b    
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      QDRANT_URL: http://qdrant:6333
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    restart: unless-stopped

  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: bot-ollama
    environment:
      OLLAMA_MODEL: qwen2.5:3b        
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: bot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  ollama_data:
    name: bot_ollama_data
  qdrant_data:
    name: bot_qdrant_data